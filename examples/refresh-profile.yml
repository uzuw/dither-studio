# Copy to .github/workflows/refresh-profile.yml in YOUR profile repository.
# Set repository variables DITHER_REPOSITORY=owner/repo and DITHER_REF=reviewed commit SHA.
# Store your recipe at dither.recipe.json in that profile repository.
name: Refresh Dither profile
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
concurrency:
  group: dither-profile
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: profile-repo
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ vars.DITHER_REPOSITORY }}
          ref: ${{ vars.DITHER_REF }}
          path: generator
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: generator/package-lock.json
      - run: npm ci
        working-directory: generator
      - name: Render public profile assets
        working-directory: generator
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: npm run render -- --username "$PROFILE_OWNER" --recipe ../profile-repo/dither.recipe.json --out ../profile-repo/profile --force
      - name: Commit generated assets
        working-directory: profile-repo
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add profile/*.svg profile/README.md profile/dither.recipe.json profile/profile-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Dither profile artwork"
            git push
          fi
